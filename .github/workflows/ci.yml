name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 顺序固定：格式化 → 类型 → 测试 → 构建 → 性能门禁。
      # 任何一步失败都不允许合并。见 specs/DESIGN.md §7.4 与 §13.3。
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run budget

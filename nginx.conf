# 自托管用的静态服务配置。
# 安全头在这里通过 HTTP 头发完整版本（frame-ancestors 无法通过 <meta> 设置）。

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 目录式 URL：/tools/x/ → /tools/x/index.html
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Astro 产出的资源文件名带内容哈希，可以永久缓存
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # HTML 不缓存，保证更新立刻生效
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

  gzip on;
  gzip_min_length 512;
  gzip_types text/html text/css application/javascript image/svg+xml;
}
